name: Build Android APK & iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis & unit tests
        run: |
          flutter analyze
          flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/LongLivePhoto-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/LongLivePhoto-Android-armeabi-v7a.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongLivePhoto-Android-APK
          path: dist/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS Unsigned IPA (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release bundle (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA for SideStore / Sideloadly
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry dist/LongLivePhoto-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongLivePhoto-iOS-IPA
          path: dist/LongLivePhoto-iOS-Unsigned.ipa
          if-no-files-found: error
